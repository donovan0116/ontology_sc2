game:
  map_name: AcropolisLE
  realtime: false
  game_step: 8
  save_replay: true

player:
  race: Terran

opponent:
  race: Terran
  difficulty: Easy

bot:
  policy: hierarchical
  worker_limit: 44
  attack_marine_threshold: 10
  supply_buffer: 6
  max_barracks: 2  # Used only by the simple-policy ablation; hierarchical builds two.
  decision_interval_steps: 4
  build_search_radius: 20
  building_spacing: 7
  expansion_worker_threshold: 20
  scout_start_time_seconds: 90
  attack_army_supply: 24
  reinforcement_army_supply: 8
  marine_to_marauder_ratio: 2
  defense_radius: 30
  rally_map_fraction: 0.35
  task_retry_limit: 3
  task_retry_cooldown_steps: 2
  task_timeout_seconds: 120

experiment:
  run_name: batch
  games: 5
  output_root: runs
  replay_root: replays
  continue_on_error: true

logging:
  event_log_enabled: true
  snapshot_interval_steps: 16
  log_level: INFO
